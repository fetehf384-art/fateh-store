<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوق فاتح الذكي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
    :root{--g:#c9a227;--gl:#e8b830;--bg:#09090f;--c:#111118;--bd:#252515;--tx:#e8dcc8;--t3:#555;--gr:#4CAF50;--rd:#FF6B6B}
    body{background:var(--bg);color:var(--tx);font-family:'Cairo',sans-serif;margin:0}
    #hdr{padding:15px;background:#1a1200;border-bottom:2px solid var(--g);display:flex;justify-content:space-between;align-items:center}
    #nav{display:flex;background:#0d0d18;overflow-x:auto;padding:5px}
    .nb{padding:10px;color:var(--t3);cursor:pointer;font-weight:700}
    .nb.on{color:var(--g);border-bottom:2px solid var(--g)}
    .pg{display:none;padding:15px}
    .pg.on{display:block}
    .card{background:var(--c);border:1px solid var(--bd);padding:15px;border-radius:10px;margin-bottom:10px}
    .inp{width:100%;padding:10px;background:#151520;border:1px solid var(--bd);color:white;border-radius:5px;margin-bottom:10px}
    .bg{padding:10px 20px;background:var(--g);border:none;border-radius:5px;font-weight:bold;cursor:pointer}
    .msg{margin-bottom:10px;padding:10px;border-radius:10px}
    .u{background:#c9a22720;text-align:right}
    .a{background:#151520;text-align:left}
</style>
</head>
<body>

<div id="hdr">
    <div style="font-weight:900;color:var(--g)">⚡ سوق فاتح الذكي</div>
</div>

<div id="nav">
    <div class="nb on" onclick="go('home')">الرئيسية</div>
    <div class="nb" onclick="go('products')">المنتجات</div>
    <div class="nb" onclick="go('agent')">AI Agent</div>
    <div class="nb" onclick="go('settings')">الإعدادات</div>
</div>

<div id="pg-home" class="pg on"><div class="card">أهلاً بك في متجرك الذكي! ابدأ التصفح.</div></div>

<div id="pg-products" class="pg"><div id="plist"></div></div>

<div id="pg-agent" class="pg">
    <div id="msgs" style="height:300px;overflow-y:auto;background:#09090f;padding:10px;border:1px solid var(--bd);margin-bottom:10px"></div>
    <input class="inp" id="cinp" placeholder="اسأل البوت...">
    <button class="bg" onclick="send()">إرسال</button>
</div>

<div id="pg-settings" class="pg">
    <input class="inp" id="akIn" type="password" placeholder="أدخل Gemini API Key هنا">
    <button class="bg" onclick="saveS()">حفظ الإعدادات</button>
</div>

<script>
function go(id){
    document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
    document.querySelectorAll('.nb').forEach(n=>n.classList.remove('on'));
    document.getElementById('pg-'+id).classList.add('on');
    event.target.classList.add('on');
}

function saveS(){
    localStorage.setItem('ak', document.getElementById('akIn').value);
    alert('✅ تم حفظ المفتاح');
}

async function send(){
    let ak = localStorage.getItem('ak');
    let q = document.getElementById('cinp').value;
    if(!ak){alert('يرجى وضع المفتاح في الإعدادات'); return;}
    document.getElementById('msgs').innerHTML += `<div class="msg u">أنت: ${q}</div>`;
    
    let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${ak}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({contents: [{parts: [{text: q}]}]})
    });
    let data = await res.json();
    let reply = data.candidates[0].content.parts[0].text;
    document.getElementById('msgs').innerHTML += `<div class="msg a">البوت: ${reply}</div>`;
    document.getElementById('cinp').value = '';
}

window.onload = () => { document.getElementById('akIn').value = localStorage.getItem('ak') || ''; }
</script>
</body>
</html>
