<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سوق فاتح الذكي - متجر متكامل</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root { --g: #c9a227; --bg: #050505; --card: #121212; --tx: #ffffff; }
body { font-family: 'Cairo', sans-serif; background: var(--bg); color: var(--tx); margin: 0; }
header { background: #000; padding: 20px; text-align: center; border-bottom: 2px solid var(--g); }
nav { display: flex; justify-content: center; gap: 20px; padding: 15px; background: #111; }
.btn-nav { color: var(--g); cursor: pointer; font-weight: 700; }
.container { max-width: 800px; margin: 20px auto; padding: 20px; }
.card { background: var(--card); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid #333; }
input, button { width: 100%; padding: 15px; margin: 10px 0; border-radius: 8px; border: none; background: #222; color: white; }
button { background: var(--g); color: #000; font-weight: 900; cursor: pointer; }
.chat-log { height: 400px; overflow-y: auto; background: #000; padding: 15px; border-radius: 10px; margin-bottom: 10px; }
.msg { margin: 10px 0; padding: 10px; border-radius: 10px; }
.user { background: #333; text-align: right; }
.ai { background: var(--g); color: #000; text-align: left; }
</style>
</head>
<body>

<header><h1>سوق فاتح الذكي</h1></header>

<nav>
    <div class="btn-nav" onclick="show('home')">🏠 الرئيسية</div>
    <div class="btn-nav" onclick="show('shop')">🛍️ المنتجات</div>
    <div class="btn-nav" onclick="show('ai')">🤖 المساعد الذكي</div>
    <div class="btn-nav" onclick="show('set')">⚙️ الإعدادات</div>
</nav>

<div class="container">
    <div id="home" class="card">
        <h2>أهلاً بك في المتجر</h2>
        <p>ربط كامل مع وسائل التواصل الاجتماعي ونظام دفع آمن.</p>
        <button onclick="window.open('https://wa.me/213000000000', '_blank')">تواصل معنا واتساب</button>
    </div>

    <div id="shop" class="card" style="display:none;">
        <h2>المنتجات المتوفرة</h2>
        <p>نظام دفع عند الاستلام / البطاقات البنكية متاح.</p>
        <button onclick="alert('تم إضافة المنتج للسلة')">شراء الآن</button>
    </div>

    <div id="ai" class="card" style="display:none;">
        <div id="chat" class="chat-log"></div>
        <input id="q" placeholder="اسأل المساعد الذكي...">
        <button onclick="ask()">إرسال الاستفسار</button>
    </div>

    <div id="set" class="card" style="display:none;">
        <h2>إعدادات الربط</h2>
        <input type="password" id="api" placeholder="Gemini API Key">
        <button onclick="localStorage.setItem('key', document.getElementById('api').value); alert('تم الحفظ');">حفظ المفتاح</button>
    </div>
</div>

<script>
function show(id) {
    document.querySelectorAll('.card').forEach(c => c.style.display = 'none');
    document.getElementById(id).style.display = 'block';
}

async function ask() {
    let key = localStorage.getItem('key');
    let q = document.getElementById('q').value;
    if(!key) return alert('أدخل المفتاح في الإعدادات');
    document.getElementById('chat').innerHTML += `<div class="msg user">${q}</div>`;
    let res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${key}`, {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({contents: [{parts: [{text: q}]}]})
    });
    let d = await res.json();
    let r = d.candidates[0].content.parts[0].text;
    document.getElementById('chat').innerHTML += `<div class="msg ai">${r}</div>`;
    document.getElementById('q').value = '';
}
</script>
</body>
</html>
